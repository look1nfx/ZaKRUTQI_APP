<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZAKRUTQI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg-top:#1b2a1f;
    --bg-bottom:#0e1610;
    --panel:#243527;
    --panel-border:#3a5240;
    --accent:#8bc34a;
    --accent-2:#ffca28;
    --text:#eef2ea;
    --text-dim:#9db09a;
    --danger:#e05c5c;
    --jar-glass:#cfe8c9;
    --jar-glass-2:#a9d69c;
    --lid:#c9a24a;
    --lid-dark:#9c7a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse at top, var(--bg-top), var(--bg-bottom));
    color:var(--text);
    overflow:hidden;
    touch-action:manipulation;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    max-width:520px;
    margin:0 auto;
  }
  header{
    padding:14px 0 10px;
    text-align:center;
  }
  .title{
    font-size:26px;
    font-weight:800;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin:0;
  }
  .subtitle{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .stats-row{
    display:flex;
    gap:10px;
    margin:12px 0;
  }
  .stat-card{
    flex:1;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:10px 12px;
    text-align:center;
  }
  .stat-label{
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .stat-value{
    font-size:20px;
    font-weight:800;
    margin-top:2px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  .cap-icon{
    width:18px;height:18px;
    display:inline-block;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d0, var(--lid) 60%, var(--lid-dark));
    box-shadow:0 0 0 2px rgba(0,0,0,.25) inset;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .combo-badge{
    position:absolute;
    top:-6px;
    font-size:14px;
    font-weight:800;
    color:var(--accent-2);
    opacity:0;
    transition:opacity .15s;
    text-shadow:0 0 8px rgba(255,202,40,.5);
  }
  .combo-badge.show{opacity:1;}
  .jar-wrap{
    position:relative;
    width:min(62vw,260px);
    height:min(62vw,260px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
  }
  .jar-wrap svg{
    width:100%;
    height:100%;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
    transition:transform .06s ease-out;
  }
  .jar-wrap.tapped svg{
    transform:scale(.93);
  }
  #lidGroup{
    transform-origin:130px 78px;
    transition:transform .08s ease-out;
  }
  .jar-wrap.tapped #lidGroup{
    transform:rotate(22deg) scale(.97);
  }
  .float-pop{
    position:absolute;
    font-weight:800;
    font-size:20px;
    color:var(--accent-2);
    pointer-events:none;
    animation:floatUp .7s ease-out forwards;
    text-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.8);opacity:0;}
    15%{opacity:1;transform:translateY(-10px) scale(1.05);}
    100%{transform:translateY(-70px) scale(1);opacity:0;}
  }
  .hint{
    margin-top:18px;
    font-size:13px;
    color:var(--text-dim);
    text-align:center;
    min-height:18px;
  }
  footer{
    padding:10px 0 16px;
  }
  .energy-label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .energy-bar{
    height:14px;
    border-radius:8px;
    background:#12200f;
    border:1px solid var(--panel-border);
    overflow:hidden;
  }
  .energy-fill{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#6fae2e,var(--accent));
    border-radius:8px;
    transition:width .2s linear;
  }
  .energy-fill.low{
    background:linear-gradient(90deg,#8a3d3d,var(--danger));
  }
  .best-row{
    text-align:center;
    margin-top:10px;
    font-size:11px;
    color:var(--text-dim);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="title">ZAKRUTQI</h1>
    <div class="subtitle">Закручуй банки на швидкість!</div>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Кришки</div>
      <div class="stat-value"><span class="cap-icon"></span><span id="capsValue">0</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Комбо</div>
      <div class="stat-value">x<span id="comboValue">1</span></div>
    </div>
  </div>

  <main>
    <div class="combo-badge" id="comboBadge">КОМБО!</div>
    <div class="jar-wrap" id="jarWrap">
      <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="130" cy="235" rx="70" ry="10" fill="#000" opacity="0.25"/>
        <path d="M75 95 Q75 78 95 78 L165 78 Q185 78 185 95 L192 205 Q192 228 165 228 L95 228 Q68 228 68 205 Z"
              fill="url(#glassGrad)" stroke="#7fa476" stroke-width="3"/>
        <path d="M85 130 Q130 145 175 130 L172 190 Q130 205 88 190 Z" fill="var(--jar-glass-2)" opacity="0.55"/>
        <rect x="88" y="60" width="84" height="24" rx="6" fill="#8f9a86" stroke="#6b756a" stroke-width="2"/>
        <g id="lidGroup">
          <ellipse cx="130" cy="58" rx="46" ry="16" fill="url(#lidGrad)" stroke="var(--lid-dark)" stroke-width="3"/>
          <ellipse cx="130" cy="54" rx="38" ry="11" fill="none" stroke="#7a5d22" stroke-width="2" opacity="0.5"/>
        </g>
        <defs>
          <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e7f5e1"/>
            <stop offset="100%" stop-color="var(--jar-glass)"/>
          </linearGradient>
          <radialGradient id="lidGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#fff3c4"/>
            <stop offset="60%" stop-color="var(--lid)"/>
            <stop offset="100%" stop-color="var(--lid-dark)"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div class="hint" id="hint">Тапай по банці, щоб закрутити!</div>
  </main>

  <footer>
    <div class="energy-label"><span>Енергія</span><span id="energyText">100/100</span></div>
    <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
    <div class="best-row">Рекорд за сесію: <span id="bestValue">0</span> кришок</div>
  </footer>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if(tg){
    try{
      tg.ready();
      tg.expand();
      if(tg.setHeaderColor) tg.setHeaderColor('#1b2a1f');
      if(tg.setBackgroundColor) tg.setBackgroundColor('#0e1610');
      if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }catch(e){}
  }

  var STORAGE_KEY = 'zakrutqi_state_v1';
  var MAX_ENERGY = 100;
  var REGEN_MS_PER_POINT = 600; // 1 energy per 0.6s -> full refill in 60s
  var COMBO_WINDOW_MS = 350;
  var COMBO_STEP = 5; // every 5 fast taps => +1 multiplier
  var MAX_MULTIPLIER = 5;

  var state = {
    caps: 0,
    best: 0,
    energy: MAX_ENERGY,
    lastRegenTs: Date.now()
  };

  try{
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(saved && typeof saved === 'object'){
      state.caps = saved.caps || 0;
      state.best = saved.best || 0;
      state.energy = (typeof saved.energy === 'number') ? saved.energy : MAX_ENERGY;
      state.lastRegenTs = saved.lastRegenTs || Date.now();
    }
  }catch(e){}

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function regenEnergy(){
    var now = Date.now();
    var elapsed = now - state.lastRegenTs;
    if(state.energy < MAX_ENERGY && elapsed > 0){
      var points = Math.floor(elapsed / REGEN_MS_PER_POINT);
      if(points > 0){
        state.energy = Math.min(MAX_ENERGY, state.energy + points);
        state.lastRegenTs = state.lastRegenTs + points * REGEN_MS_PER_POINT;
      }
    } else if(state.energy >= MAX_ENERGY){
      state.lastRegenTs = now;
    }
  }

  var capsValueEl = document.getElementById('capsValue');
  var comboValueEl = document.getElementById('comboValue');
  var comboBadgeEl = document.getElementById('comboBadge');
  var bestValueEl = document.getElementById('bestValue');
  var energyFillEl = document.getElementById('energyFill');
  var energyTextEl = document.getElementById('energyText');
  var jarWrapEl = document.getElementById('jarWrap');
  var hintEl = document.getElementById('hint');

  var comboCount = 0;
  var lastTapTs = 0;
  var comboBadgeTimer = null;

  function currentMultiplier(){
    return Math.min(MAX_MULTIPLIER, 1 + Math.floor(comboCount / COMBO_STEP));
  }

  function render(){
    capsValueEl.textContent = state.caps;
    bestValueEl.textContent = state.best;
    comboValueEl.textContent = currentMultiplier();
    var pct = Math.round((state.energy / MAX_ENERGY) * 100);
    energyFillEl.style.width = pct + '%';
    energyTextEl.textContent = Math.floor(state.energy) + '/' + MAX_ENERGY;
    if(pct <= 20){ energyFillEl.classList.add('low'); } else { energyFillEl.classList.remove('low'); }
    if(state.energy <= 0){
      hintEl.textContent = 'Енергія закінчилась — зачекай, поки відновиться';
    } else {
      hintEl.textContent = 'Тапай по банці, щоб закрутити!';
    }
  }

  function spawnFloatPop(text, x, y){
    var el = document.createElement('div');
    el.className = 'float-pop';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 700);
  }

  function handleTap(evt){
    regenEnergy();
    if(state.energy < 1){
      render();
      save();
      if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      return;
    }

    var now = Date.now();
    if(now - lastTapTs <= COMBO_WINDOW_MS){
      comboCount++;
    } else {
      comboCount = 1;
    }
    lastTapTs = now;

    var mult = currentMultiplier();
    var gained = 1 * mult;

    state.energy = Math.max(0, state.energy - 1);
    state.caps += gained;
    if(state.caps > state.best) state.best = state.caps;

    render();
    save();

    jarWrapEl.classList.add('tapped');
    setTimeout(function(){ jarWrapEl.classList.remove('tapped'); }, 90);

    if(mult > 1){
      comboBadgeEl.classList.add('show');
      clearTimeout(comboBadgeTimer);
      comboBadgeTimer = setTimeout(function(){ comboBadgeEl.classList.remove('show'); }, 400);
    }

    var rect = jarWrapEl.getBoundingClientRect();
    var touchX = rect.left + rect.width/2;
    var touchY = rect.top + rect.height/2;
    if(evt && evt.changedTouches && evt.changedTouches[0]){
      touchX = evt.changedTouches[0].clientX;
      touchY = evt.changedTouches[0].clientY;
    } else if(evt && typeof evt.clientX === 'number'){
      touchX = evt.clientX;
      touchY = evt.clientY;
    }
    spawnFloatPop('+' + gained, touchX - 12, touchY - 20);

    if(tg && tg.HapticFeedback){
      tg.HapticFeedback.impactOccurred(mult >= MAX_MULTIPLIER ? 'heavy' : (mult > 1 ? 'medium' : 'light'));
    }
  }

  jarWrapEl.addEventListener('touchstart', function(e){ e.preventDefault(); handleTap(e); }, {passive:false});
  jarWrapEl.addEventListener('mousedown', function(e){ handleTap(e); });

  setInterval(function(){
    regenEnergy();
    render();
    save();
  }, 250);

  render();
})();
</script>
</body>
</html>
